services:
  redis:
    image: redis:8-alpine
    container_name: task-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    container_name: task-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: task
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DB: localize
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "task", "--password", "password", "--query", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
    driver: local
  clickhouse-data:
    driver: local
